services:
  world-harness:
    build:
      context: .
      dockerfile: Dockerfile
    image: world-harness:local
    container_name: world-harness
    ports:
      - "8097:8097"
    environment:
      WORLD_HARNESS_ADDR: ":8097"
      WORLD_HARNESS_PACKS_ROOT: /app/packs
      WORLD_HARNESS_BASE_PATH: /world
      WORLD_HARNESS_DEFAULT_PACK: lumen-federation
      WORLD_HARNESS_AUTH_REQUIRED: "false"
      WORLD_HARNESS_STORY_ENABLED: "false"
    volumes:
      - ./packs:/app/packs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8097/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3

  world-harness-story:
    build:
      context: .
      dockerfile: Dockerfile
    image: world-harness:local
    container_name: world-harness-story
    command:
      - world-tool
      - serve
      - --addr
      - :8097
      - --packs-root
      - /app/packs
      - --base-path
      - /world-story
      - --data-root
      - /app/data
      - --auth-required
      - --story-enabled
    ports:
      - "8098:8097"
    environment:
      WORLD_HARNESS_ADDR: ":8097"
      WORLD_HARNESS_PACKS_ROOT: /app/packs
      WORLD_HARNESS_BASE_PATH: /world-story
      WORLD_HARNESS_DEFAULT_PACK: lumen-federation
      WORLD_HARNESS_DATA_ROOT: /app/data
      WORLD_HARNESS_AUTH_REQUIRED: "true"
      WORLD_HARNESS_STORY_ENABLED: "true"
      WORLD_HARNESS_ADMIN_USERNAME: ${WORLD_HARNESS_ADMIN_USERNAME:-}
      WORLD_HARNESS_ADMIN_PASSWORD: ${WORLD_HARNESS_ADMIN_PASSWORD:-}
      WORLD_HARNESS_ADMIN_PASSWORD_FILE: ${WORLD_HARNESS_ADMIN_PASSWORD_FILE:-}
      WORLD_HARNESS_ADMIN_DISPLAY_NAME: ${WORLD_HARNESS_ADMIN_DISPLAY_NAME:-}
      WORLD_HARNESS_GM_PROVIDER: ${WORLD_HARNESS_GM_PROVIDER:-codex_cli}
      WORLD_HARNESS_HERMES_API_BASE_URL: ${WORLD_HARNESS_HERMES_API_BASE_URL:-}
      WORLD_HARNESS_HERMES_API_KEY: ${WORLD_HARNESS_HERMES_API_KEY:-}
      WORLD_HARNESS_HERMES_MODEL: ${WORLD_HARNESS_HERMES_MODEL:-}
      CODEX_HOME: /home/node/.codex
    volumes:
      - ./packs:/app/packs:ro
      - ./.world-harness-data:/app/bootstrap:ro
      - ${CODEX_HOME:-${HOME}/.codex}:/home/node/.codex
      - world_harness_story_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8097/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3

  world-harness-telegram:
    image: world-harness:local
    container_name: world-harness-telegram
    profiles:
      - telegram
    command:
      - world-tool
      - telegram
      - --packs-root
      - /app/packs
      - --repo-root
      - /app
      - --default-pack
      - lumen-federation
    environment:
      WORLD_HARNESS_PACKS_ROOT: /app/packs
      WORLD_HARNESS_REPO_ROOT: /app
      WORLD_HARNESS_DEFAULT_PACK: lumen-federation
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_ID: ${TELEGRAM_ALLOWED_CHAT_ID:-}
      CODEX_HOME: /home/node/.codex
    volumes:
      - ./packs:/app/packs
      - ./.worlds.yaml:/app/.worlds.yaml:ro
      - ${CODEX_HOME:-${HOME}/.codex}:/home/node/.codex
    restart: unless-stopped
    depends_on:
      - world-harness

volumes:
  world_harness_story_data:
