# Minimal reverse-proxy fragment for serving world-harness under /world/.
# Include this inside the existing urrrm.com server blocks, or keep the
# equivalent block in /Users/hoonzi/Documents/docker_v/nginx/default.conf.

location /world/ {
    proxy_pass http://host.docker.internal:8097/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /world;
}

location = /world {
    return 301 $scheme://$host/world/;
}

location /world-story/ {
    proxy_pass http://host.docker.internal:8098/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /world-story;
    proxy_read_timeout 300s;
}

location = /world-story {
    return 301 $scheme://$host/world-story/;
}
